<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instrux Helper</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="container">
    <h1>Instrux Helper</h1>

    <div class="section">
        <h2>Groq API Key</h2>
        <input
        id="apiKey"
        type="password"
        placeholder="gsk_..."
        autocomplete="off"
        />
        <button id="saveApiKeyBtn" class="secondary">Сохранить API key</button>
    </div>

    <div class="actions">
      <button id="sendPromptBtn" class="secondary">Отправить промт</button>
    </div>

    <div class="section">
      <h2>Question</h2>
      <pre id="question">Waiting...</pre>
    </div>

    <div class="section">
      <h2>Options</h2>
      <pre id="options">Waiting...</pre>
    </div>

    <div class="section">
      <h2>Analysis</h2>
      <pre id="analysis">No analysis yet</pre>
    </div>

    <div class="status" id="status">Ready</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
