<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LazyTest AI</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">Assistant</div>
        <h1>LazyTest AI</h1>
      </div>
      <div class="status-dot" id="statusDot"></div>
    </header>

    <section class="card">
      <div class="section-head">
        <h2>API key</h2>
      </div>

      <input
        id="apiKey"
        type="password"
        placeholder="gsk_..."
        autocomplete="off"
      />

      <button id="saveApiKeyBtn" class="btn btn-secondary">
        Save Key
      </button>
    </section>

    <section class="actions">
      <button id="sendPromptBtn" class="btn btn-primary">
        Get Answer
      </button>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Question</h2>
      </div>
      <pre id="question" class="content-block">Waiting...</pre>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Options</h2>
      </div>
      <pre id="options" class="content-block">Waiting...</pre>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Analysis</h2>
      </div>
      <pre id="analysis" class="content-block muted">No analysis yet</pre>
    </section>

    <footer class="footer-status">
      <span class="status-label">Status</span>
      <span id="status">Ready</span>
    </footer>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
